<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a8f3a"/>
    </marker>
  </defs>

  <!-- opaque light background so the diagram stays legible in dark mode too -->
  <rect x="0" y="0" width="620" height="300" fill="#ffffff"/>

  <!-- fluid -->
  <rect x="100" y="60" width="420" height="160" fill="#d9f0d3"/>

  <!-- centerline -->
  <line x1="100" y1="140" x2="520" y2="140" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- pipe walls -->
  <line x1="100" y1="60" x2="520" y2="60" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="100" y1="220" x2="520" y2="220" stroke="#1a1a1a" stroke-width="4"/>

  <!-- velocity profile: station line, parabola (quadratic Bezier = exact parabola), arrows at r/R = -0.5, 0, 0.5 -->
  <line x1="210" y1="60" x2="210" y2="220" stroke="#3a8f3a" stroke-width="3"/>
  <path d="M 210 60 Q 450 140 210 220" fill="none" stroke="#3a8f3a" stroke-width="1.5"/>
  <line x1="210" y1="100" x2="300" y2="100" stroke="#3a8f3a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="210" y1="140" x2="330" y2="140" stroke="#3a8f3a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="210" y1="180" x2="300" y2="180" stroke="#3a8f3a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="312" y="200" font-size="18" fill="#3a8f3a"><tspan font-style="italic">u</tspan><tspan font-size="12" dy="4" font-style="italic">z</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">r</tspan>)</text>

  <!-- fluid properties -->
  <text x="410" y="105" font-size="19" font-style="italic" fill="#c0392b" text-anchor="middle">&#961;, &#956;</text>

  <!-- R: centerline to wall -->
  <line x1="470" y1="140" x2="470" y2="62" stroke="#c0392b" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="462" y1="140" x2="478" y2="140" stroke="#c0392b" stroke-width="1.3"/>
  <text x="486" y="108" font-size="19" font-style="italic" fill="#c0392b">R</text>

  <!-- end pressures -->
  <text x="50" y="146" font-size="19" fill="#8e44ad" text-anchor="middle"><tspan font-style="italic">p</tspan><tspan font-size="12" dy="4">0</tspan><tspan dy="-4" dx="4">+ &#916;</tspan><tspan font-style="italic">p</tspan></text>
  <text x="560" y="146" font-size="19" fill="#8e44ad" text-anchor="middle"><tspan font-style="italic">p</tspan><tspan font-size="12" dy="4">0</tspan></text>

  <!-- L: pipe length -->
  <line x1="100" y1="250" x2="520" y2="250" stroke="#c0392b" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="100" y1="242" x2="100" y2="258" stroke="#c0392b" stroke-width="1"/>
  <line x1="520" y1="242" x2="520" y2="258" stroke="#c0392b" stroke-width="1"/>
  <rect x="298" y="240" width="24" height="20" fill="#ffffff"/>
  <text x="310" y="257" font-size="19" font-style="italic" fill="#c0392b" text-anchor="middle">L</text>
</svg>

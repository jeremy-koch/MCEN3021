<svg xmlns="http://www.w3.org/2000/svg" width="620" height="245" viewBox="0 0 620 245" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3a8f3a"/>
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- opaque light background so the diagram stays legible in dark mode too -->
  <rect x="0" y="0" width="620" height="245" fill="#ffffff"/>

  <!-- fluid -->
  <rect x="100" y="60" width="420" height="160" fill="#d9f0d3"/>

  <!-- channel walls -->
  <line x1="100" y1="60" x2="520" y2="60" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="100" y1="220" x2="520" y2="220" stroke="#1a1a1a" stroke-width="4"/>

  <!-- velocity profile: station line, linear profile from 0 (bottom) to U (top), arrows at y/h = 0.25, 0.5, 0.75 -->
  <line x1="210" y1="60" x2="210" y2="220" stroke="#3a8f3a" stroke-width="3"/>
  <line x1="210" y1="220" x2="330" y2="60" stroke="#3a8f3a" stroke-width="1.5"/>
  <line x1="210" y1="180" x2="240" y2="180" stroke="#3a8f3a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="210" y1="140" x2="270" y2="140" stroke="#3a8f3a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="210" y1="100" x2="300" y2="100" stroke="#3a8f3a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="262" y="200" font-size="18" fill="#3a8f3a"><tspan font-style="italic">u</tspan><tspan font-size="12" dy="4" font-style="italic">x</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">y</tspan>)</text>

  <!-- top wall moves at U -->
  <line x1="260" y1="40" x2="360" y2="40" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow-dark)"/>
  <text x="375" y="46" font-size="20" font-style="italic" fill="#1a1a1a">U</text>

  <!-- fluid properties -->
  <text x="410" y="105" font-size="19" font-style="italic" fill="#c0392b" text-anchor="middle">&#961;, &#956;</text>

  <!-- h: full channel height -->
  <line x1="470" y1="63" x2="470" y2="217" stroke="#c0392b" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="486" y="146" font-size="19" font-style="italic" fill="#c0392b">h</text>

</svg>

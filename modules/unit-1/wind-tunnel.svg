<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="warrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c64d1"/>
    </marker>
  </defs>

  <!-- tunnel floor -->
  <line x1="20" y1="210" x2="500" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- test object: a blunt rounded body sitting on the floor -->
  <path d="M 220 210
           L 220 175
           Q 220 140 260 132
           L 330 132
           Q 370 132 380 165
           Q 385 185 370 210
           Z"
        fill="#e4e4e4" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- streamlines: blue arrows left-to-right, some bending over the body -->
  <g stroke="#1c64d1" stroke-width="2.2" fill="none">
    <path d="M 40 80  L 470 80"  marker-end="url(#warrow)"/>
    <path d="M 40 105 L 470 105" marker-end="url(#warrow)"/>
    <path d="M 40 130 Q 250 100 300 128 Q 340 145 470 130" marker-end="url(#warrow)"/>
    <path d="M 40 155 Q 230 150 260 160 Q 320 185 470 160" marker-end="url(#warrow)"/>
    <path d="M 40 185 L 190 185" marker-end="url(#warrow)"/>
    <path d="M 400 190 L 470 190" marker-end="url(#warrow)"/>
    <path d="M 40 205 L 470 205" marker-end="url(#warrow)" stroke-dasharray="1 6"/>
  </g>

  <text x="255" y="45" font-size="18" fill="#1a1a1a" text-anchor="middle">wind tunnel: air passing over an object</text>
</svg>

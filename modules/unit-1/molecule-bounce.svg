<svg xmlns="http://www.w3.org/2000/svg" width="230" height="290" viewBox="0 0 230 290">
  <!-- opaque light background so the diagram stays legible in dark mode too -->
  <rect x="0" y="0" width="230" height="290" fill="#ffffff"/>

  <!-- wall, normal pointing in the -x direction -->
  <rect x="190" y="0" width="22" height="290" fill="#4b4b4b" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- each molecule: incoming path, bounce off the wall, reflected outgoing path -->
  <g fill="none" stroke-width="2.2">
    <!-- purple -->
    <path d="M 120 10 L 190 55" stroke="#7c3aed"/>
    <path d="M 190 55 L 120 100" stroke="#7c3aed"/>
    <circle cx="158" cy="35" r="11" fill="#a78bfa" stroke="#5b21b6" stroke-width="2"/>

    <!-- blue -->
    <path d="M 90 70 L 190 95" stroke="#2563eb"/>
    <path d="M 190 95 L 110 115" stroke="#2563eb"/>
    <circle cx="150" cy="85" r="11" fill="#60a5fa" stroke="#1e40af" stroke-width="2"/>

    <!-- green -->
    <path d="M 70 55 L 190 175" stroke="#16a34a"/>
    <path d="M 190 175 L 118 247" stroke="#16a34a"/>
    <circle cx="124" cy="109" r="11" fill="#4ade80" stroke="#166534" stroke-width="2"/>

    <!-- orange: not every molecule is headed for the wall, this one travels up and to the left (11 o'clock), clear of it -->
    <path d="M 150 290 L 70 150" stroke="#ea580c"/>
    <circle cx="90" cy="185" r="11" fill="#fb923c" stroke="#9a3412" stroke-width="2"/>

    <!-- red -->
    <path d="M 70 270 L 190 255" stroke="#dc2626"/>
    <path d="M 190 255 L 82 241" stroke="#dc2626"/>
    <circle cx="118" cy="264" r="11" fill="#f87171" stroke="#991b1b" stroke-width="2"/>
  </g>
</svg>

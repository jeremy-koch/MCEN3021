<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- ground hatching directly under the material (no separate bottom plate: this is a fixed support) -->
  <g stroke="#1a1a1a" stroke-width="1.2">
    <line x1="75" y1="210" x2="90" y2="225"/>
    <line x1="100" y1="210" x2="115" y2="225"/>
    <line x1="125" y1="210" x2="140" y2="225"/>
    <line x1="150" y1="210" x2="165" y2="225"/>
    <line x1="175" y1="210" x2="190" y2="225"/>
    <line x1="200" y1="210" x2="215" y2="225"/>
    <line x1="225" y1="210" x2="240" y2="225"/>
    <line x1="250" y1="210" x2="265" y2="225"/>
    <line x1="275" y1="210" x2="290" y2="225"/>
    <line x1="300" y1="210" x2="315" y2="225"/>
    <line x1="325" y1="210" x2="340" y2="225"/>
    <line x1="350" y1="210" x2="365" y2="225"/>
    <line x1="375" y1="210" x2="390" y2="225"/>
    <line x1="400" y1="210" x2="415" y2="225"/>
  </g>
  <line x1="70" y1="210" x2="430" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- material block, resting directly on the fixed ground -->
  <rect x="70" y="96" width="360" height="114" fill="#d9f0d3" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- material property labels, inside the block -->
  <text x="250" y="148" font-size="19" font-style="italic" text-anchor="middle" fill="#1a1a1a">&#961;</text>
  <text x="250" y="180" font-size="19" text-anchor="middle" fill="#1a1a1a"><tspan font-style="italic">G</tspan><tspan dx="8" font-style="normal">or</tspan><tspan dx="8" font-style="italic">&#956;</tspan></text>

  <!-- top plate (thicker, so the A label has room and doesn't touch the edges) -->
  <rect x="70" y="74" width="360" height="22" fill="#c9c9c9" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="250" y="90" font-size="17" font-style="italic" text-anchor="middle" fill="#1a1a1a">A</text>

  <!-- h dimension, left of the block -->
  <line x1="40" y1="96" x2="40" y2="210" stroke="#1a1a1a" stroke-width="1.3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line x1="36" y1="96" x2="70" y2="96" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="36" y1="210" x2="70" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <text x="24" y="158" font-size="18" font-style="italic" text-anchor="middle" fill="#1a1a1a">h</text>

  <!-- applied force F on the top plate -->
  <line x1="430" y1="85" x2="495" y2="85" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="462" y="66" font-size="20" font-style="italic" text-anchor="middle" fill="#1a1a1a">F</text>
</svg>

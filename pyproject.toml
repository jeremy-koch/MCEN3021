[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluidtools"
version = "2.1.0"
description = "Teaching toolbox suite for MCEN 3021 Fluid Mechanics: hydrostatics, control-volume momentum, dimensional analysis, pipe networks & pumps, external flow, flow meters, open channels, turbomachinery."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/fluidtools"]

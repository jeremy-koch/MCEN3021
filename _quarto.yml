project:
  type: website
  render:
    - "*.qmd"
    # The site is stripped down to course bureaucracy (index/syllabus)
    # plus the readings published so far. Project, Homework, Tools, and
    # Reference pages are gitignored and excluded here; restore each as
    # it's ready.
    - "!project.qmd"
    - "!homework.qmd"
    - "!tools.qmd"
    - "!reference.qmd"
    - "!homework/solutions/"
    - "!conceptests/"
    - "!modules/unpublished/"
  pre-render: python scripts/make_bundle.py
  resources:
    - fluidtools_bundle.py

website:
  title: "MCEN 3021 Fluid Mechanics"
  navbar:
    left:
      - href: index.qmd
        text: How This Course Works
      - href: syllabus.qmd
        text: Syllabus
      - href: schedule.qmd
        text: Schedule
      # Project, Tools, and Reference pages are gitignored while the
      # site is stripped down. Restore these entries when they come back.
      # - href: project.qmd
      #   text: Project
      # - href: tools.qmd
      #   text: Tools
      # - href: reference.qmd
      #   text: Reference
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - syllabus.qmd
      - schedule.qmd
      - section: "Unit 1 · Fluid properties, units, and dimensions"
        contents:
          - modules/unit-1/pressure.qmd
          - modules/unit-1/viscosity.qmd
          - modules/unit-1/units-and-dims.qmd
          - modules/unit-1/b-pi.qmd
          - modules/unit-1/strouhal_number.qmd
          - modules/unit-1/unit-1-clickers.qmd
      - section: "Unit 2 · Hydrostatics"
        contents:
          - modules/unit-2/hydrostatics.qmd
          - modules/unit-2/p-int.qmd
          # 2.3 (rigid-body acceleration) is an optional "extra" reading,
          # not required, published out of order.
          - modules/unit-2/rigid-accel.qmd
          - modules/unit-2/curved-int.qmd
          - modules/unit-2/moments.qmd
          - modules/unit-2/unit-2-clickers.qmd
      - section: "Unit 3 · Bernoulli's equation"
        contents:
          - modules/unit-3/bernoulli.qmd
          - modules/unit-3/bernoulli-app.qmd
          - modules/unit-3/lift-drag.qmd
          - modules/unit-3/joukowski.qmd
          - modules/unit-3/unit-3-clickers.qmd
      - section: "Homework"
        contents:
          - homework/hw1.qmd
          - homework/hw1_sol.qmd
          - homework/hw2.qmd
          - homework/hw2_sol.qmd
          - homework/hw3.qmd
          - homework/hw4.qmd
      # Everything not yet published lives in modules/unpublished/ (flat,
      # with superseded drafts in modules/unpublished/old/). The three
      # live units above were regrouped from the old week-based folders:
      # new unit-1 = old 1.x + 2.x, new unit-2 = old 3.x + 4.1/4.3,
      # new unit-3 = old 5.1/5.2 + 6.1. Drafts keep their old titles and
      # numbering; renumber when promoting one into a unit folder.
      # Old unit sketch, for reference (all paths under modules/unpublished/):
      # - project.qmd
      #   what-is-a-fluid, fluid-properties, properties-worked, b-pi-extra
      #   flow-measurement, bernoulli-worked (in old/)
      #   control-volumes-mass, energy-equation, momentum, cv-worked
      #   differential-analysis, reading-flow-profiles, profiles-worked
      #   boundary-layers, drag, lift, external-worked
      #   pipe-flow-regimes, major-losses, minor-losses-networks,
      #     pumped-systems, pipe-worked
      #   channel-critical-flow, channel-uniform-flow, hydraulic-jumps,
      #     channel-worked
      #   pump-theory, pump-performance, turbines, turbo-worked
      # - homework.qmd
      # - tools.qmd
      # - reference.qmd
  page-footer: "MCEN 3021 · Jeremy Koch, University of Colorado Boulder · Fall 2026"

format:
  live-html:
    toc: true
    theme:
      light: cosmo
      dark: darkly

pyodide:
  packages:
    - numpy
    - scipy
    - matplotlib

engine: jupyter

          - modules/unit-1/fluid-properties.qmd
          - modules/unit-1/properties-worked.qmd
      - section: "Unit 2 · Dimensional Analysis"
        contents:
          - modules/unit-2/dimensional-analysis.qmd
          - modules/unit-2/similitude-model-testing.qmd
          - modules/unit-2/dimensional-worked.qmd
      # Units 3-10 are drafted but gitignored (not yet ready to publish --

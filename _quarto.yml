project:
  type: website
  render:
    - "*.qmd"
    # The site is stripped down to course bureaucracy (index/syllabus)
    # plus one reading. Project, Homework, Tools, and Reference pages
    # are gitignored and excluded here; restore each as it's ready.
    - "!project.qmd"
    - "!homework.qmd"
    - "!tools.qmd"
    - "!reference.qmd"
    - "!homework/solutions/"
    - "!conceptests/"
    - "!modules/unit-1/what-is-a-fluid.qmd"
    - "!modules/unit-1/fluid-properties.qmd"
    - "!modules/unit-1/properties-worked.qmd"
    - "!modules/unit-2/"
    - "!modules/unit-3/"
    - "!modules/unit-4/"
    - "!modules/unit-5/"
    - "!modules/unit-6/"
    - "!modules/unit-7/"
    - "!modules/unit-8/"
    - "!modules/unit-9/"
    - "!modules/unit-10/"
  pre-render: python scripts/make_bundle.py
  resources:
    - fluidtools_bundle.py


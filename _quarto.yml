project:
  type: website
  render:
    - "*.qmd"
    - "modules/*.qmd"
    - "modules/**/*.qmd"
    - "!homework/"
    # Units 3-10 are gitignored while still in draft (see .gitignore).
    # Excluded here too so `quarto render`/`preview` skip them even when
    # the drafts are present on a local disk. Remove a unit's line here,
    # and restore its sidebar section above, as it's ready to publish.
    - "!modules/unit-3/"
    - "!modules/unit-4/"
    - "!modules/unit-5/"
    - "!modules/unit-6/"
    - "!modules/unit-7/"
    - "!modules/unit-8/"
    - "!modules/unit-9/"
    - "!modules/unit-10/"
  pre-render: python scripts/make_bundle.py
  resources:
    - fluidtools_bundle.py

website:
  title: "MCEN 3021 Fluid Mechanics"
  navbar:
    left:
      - href: index.qmd
        text: How This Course Works
      - href: syllabus.qmd
        text: Syllabus
      - href: project.qmd
        text: Project
      - href: tools.qmd
        text: Tools
      - href: reference.qmd
        text: Reference
    right:
      - icon: github
        href: https://github.com/YOURUSERNAME/fluidtools
  sidebar:
    style: docked
    search: true
    contents:
